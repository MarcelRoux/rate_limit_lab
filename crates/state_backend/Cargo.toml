[package]
name = "state_backend"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "=1.49.0", features = ["rt-multi-thread", "macros", "time", "sync"] }
async-trait = { version = "=0.1.89" }
thiserror = { version = "=2.0.18" }

# fred (Redis/Valkey client)
fred = { version = "=10.1.0", features = ["enable-rustls", "i-scripts"] }

[features]
# Enables integration tests that hit a real Redis instance.
redis-tests = []