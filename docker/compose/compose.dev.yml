name: rate-limit-lab

services:
  rest_observability:
    build:
      context: ../..
      dockerfile: docker/observability/rest/Dockerfile
    image: rate-limit-lab-observability:dev
    container_name: rest_observability
    profiles: ["observability"]
    command: ["rest_server", "--config", "configs/rest_server/observability_container.toml"]
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/metrics"]
      interval: 5s
      timeout: 2s
      retries: 20

  traffic_rest_observability:
    image: rate-limit-lab-observability:dev
    profiles: ["observability"]
    command: ["rest_traffic", "--config", "configs/traffic_rest/smoke/observability_demo__single_key__steady__1000x4__5s.toml"]
    depends_on:
      rest_observability:
        condition: service_healthy

  redis:
    image: redis:8.4
    container_name: redis
    command: ["redis-server"]
    ports:
      - "6379:6379"
    profiles: ["redis"]
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 2s
      timeout: 1s
      retries: 20
    env_file:
      - ../env/dev.env

  # Planned (optional). Disabled unless you explicitly start it.
  valkey:
    image: valkey/valkey:8
    container_name: valkey
    command: ["valkey-server"]
    ports:
      - "6380:6379"
    profiles: ["valkey"]
    healthcheck:
      test: ["CMD", "valkey-cli", "PING"]
      interval: 2s
      timeout: 1s
      retries: 20

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    profiles: ["observability"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=3d"
      - "--web.enable-lifecycle"
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 2s
      retries: 20

  grafana:
    image: grafana/grafana:11.2.2
    container_name: grafana
    profiles: ["observability"]
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/rate_limit_lab_overview.json
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
